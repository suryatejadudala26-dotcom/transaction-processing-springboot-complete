spring:
  datasource:
    url: jdbc:h2:file:./data/transactions;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
server:
  port: 8080
app:
  processor:
    fixed-delay-ms: 2000
    max-retries: 3
logging:
  level:
    com.example.transactions: INFO
